name: docs-test

on:
  schedule:
    - cron: "0 0 * * 0"
  pull_request:
    branches: ["dev", "main"]
  push:
    branches: ["dev"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      - name: mdbook Code Check
        run: nix develop --command bash -c "mdbook test ./docs"
      # Build mdbook
      - name: mdbook Build Check
        run: nix develop --command bash -c "mdbook build ./docs"
      # Build Astro
      - name: Astro Build Check
        run: nix develop --command bash -c "cd hub && npm i && npm run build"
      # Build rustdoc
      - name: rustdoc Build Check
        run: nix develop --command bash -c "cargo doc --no-deps --workspace"